<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160">
  <defs>
    <linearGradient id="plumbGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="plumbGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="plumbGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
  </defs>
  <!-- Top facets -->
  <polygon points="50,5 20,80 50,70" fill="url(#plumbGradLeft)" stroke="#15803d" stroke-width="1.5" />
  <polygon points="50,5 80,80 50,70" fill="url(#plumbGradRight)" stroke="#15803d" stroke-width="1.5" />
  <!-- Bottom facets -->
  <polygon points="50,155 20,80 50,70" fill="url(#plumbGradBottom)" stroke="#15803d" stroke-width="1.5" />
  <polygon points="50,155 80,80 50,70" fill="url(#plumbGradLeft)" stroke="#15803d" stroke-width="1.5" />
</svg>
